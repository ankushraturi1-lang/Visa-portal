age Testing Certificate":"- English proficiency as per university\n- NEET Scorecard (mandatory for Indian MBBS applicants)","HEALTH INSURANCE":"Mandatory — medical / travel insurance covering the stay in Georgia","Travel History":"Last 12 months travel history and all previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs\n- Size: 35mm × 45mm\n- Background: Plain, light-coloured (preferably white)\n- Recent: Taken within the last 6 months","(PCC)":"Not mandatory (may be requested)","Accommodation Documents":"Accommodation payment/details\n- Booking Confirmation/ Receipt","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- D3 Visa Application Form (e-visa portal / VFS)\n- Parental Consent Letter, if under 18\n- Birth Certificate\n- Cover Letter"},{"_row":37,"country_id":"uzbekistan","Country":"Uzbekistan","flag":"🇺🇿","region":"Europe & CIS","Visa Type":"Student Visa","TAGS":"Sticker visa","Visa Costs":"💰 Fee Bifurcation\n* Consular Visa Fee student: ₹32,450 (May change According to university)\n\nOther Costs (paid separately):\n* Health insurance: approx. ₹3,000–8,000\n* Notary - ₹300","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","Passport":"- Valid Passport\n- Front & Back Pages\n- Minimum 6 Months Validity","Academic Transcripts":"For Bachelor's Applicants:\n* 10th Marksheet & Certificate\n* 12th Marksheet & Certificate\nFor Master's Applicants:\n* Bachelor's Degree Certificate\n* Complete Academic Transcripts / Marksheets\nFor PhD Applicants:\n* Master's Degree Certificate\n* Academic Transcripts\n* Research Proposal / Research Documents","Bank Statement with Minimum Balance":"🏦 Bank Account Statements:\nOriginal personal or sponsor bank statements for the last 6 months, stamped and \nsigned by the bank, demonstrating consistent and liquid funds without sudden large \ndeposits. Minimum requirement is 10-12 lakhs INR.","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"Added: MFA visa support / invitation — the embassy will not process a student visa without it. \n- University Offer Letter (TELEX)\n- Invitation / Visa Support issued via Ministry of Foreign Affairs of Uzbekistan (arranged by university)\n- Tuition Fee details and fee payment confirmation\n- Accommodation payment/details","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"General Health Fitness: You must provide a general medical fitness \ncertificate showing you are in good health.\nHIV/AIDS Test: A negative HIV/AIDS test report is a standard requirement \nfor long-term stay and student visas.\nTranslation and Legalization: The medical reports often need to be translated into \nthe Uzbek language and officially notarized or certified as requested by the embassy \nor consulate.","Academic and Language Testing Certificate":"Added NEET line for MBBS applicants (NMC requirement). As Per Requirement by the university -\nEnglish B2 level (IELTS, TOEFL)\nNEET Scorecard (mandatory for Indian MBBS applicants)","HEALTH INSURANCE":"Uzbekistan does not enforce a rigid, federally mandated minimum financial \ncoverage sum (such as a fixed €30,000 requirement) for a student visa, but \nhealth insurance must cover the full duration of your stay and remain active \nthroughout your enrollment.","Travel History":"Last 12 months travel history and all previous visas copy (if any)","Passport SIze Coloured Photo":"3 Passport size photo\n- Size: 35 × 45 mm\n- Type: Biometric passport photo\n- Background: White/light-coloured\n- Face Coverage: 70–80%\n- Recent Photo: Not older than 6 months","(PCC)":"Not mandatory but adds value","Accommodation Documents":"Accommodation payment/details\n- Booking Confirmation/ Receipt","Residence Proof":"* Aadhaar Card\nOR\n* Utility Bill (not older than 6 months)\nOR\n* Rental Agreement\nOR\n* Property Ownership Documents\nOR\n* Other Government-issued Residence Proof"},{"_row":38,"country_id":"uk","Country":"UK","flag":"🇬🇧","region":"UK & Pacific","Visa Type":"Student Visa","TAGS":"E- Visa","Visa Costs":"💰 Fee Bifurcation\n* Govt Fee = 558 GBP (~71,486 INR)\n* IHS = 776 GBP Per Year (~99,500 INR / Year)\n\nOptional\n* Priority = 500 GBP Additional\n* Super Priority = 1000 GBP Additional\n\nOther Costs (paid separately):\n* Courier (optional): as per VFS","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"CORRECTED: Super Priority is £1,000 extra (was written as £800 here, while the Visa \nCosts cell already said £1,000). * 🐢 Standard: ~ 3 weeks from biometric date\n* ⚡ Priority: ~5 working days (£500 extra)\n* 🚀 Super Priority: Next working day (£1,000 extra)","Application Process":"UK Student Visa Application Process – Indian Student\n\nUniversity Admission\n\n- Receive an unconditional offer from a UK university/college.\n- Pay the required deposit/tuition fee, if applicable.\n\nReceive CAS\n\n\nPrepare Documents\n\nValid Passport,CAS, Financial proof, if required, TB Certificate, English-language evidence, if required, ATAS Certificate, if applicable, Academic documents, as applicable\nSponsor/financial-sponsorship documents, if applicable)\n\nComplete Online Application\n\nApply online through GOV.UK.\nStudent Visa application fee is currently £558 for applications from outside the UK.\nPay IHS\nBook Biometrics Appointment\nAfter submitting the application, complete identity verification as instructed.\nThis may involve fingerprints and photograph at a visa application centre.\nSubmit Documents & Biometrics\nVisa Processing\nStandard processing from outside the UK is usually 3 weeks after the required application/identity steps are completed. Additional processing or an interview may be required in some cases.\nVisa Decision & eVisa\nIf approved, you will receive instructions to access your eVisa through your UKVI account.\nTravel to the UK\n\n\n\n\n\n\n\nFor a course longer than 6 months, you can generally arrive up to 1 month before the course start date, subject to the date permitted on your visa.","Passport":"- Valid Passport\n- Front & Back Pages\n- Minimum 6 Months Validity","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required","Bank Statement with Minimum Balance":"CORRECTED. Old text said living costs 'for 1 year: London £19,200 / Outside £14,500' — \nUKVI asks for up to 9 months: £1,529 (London) / £1,171 (outside) per month; rising to \n£1,570 / £1,203 for applications from 30 Nov 2026. Funds must be held 28 days. - Funds must \nbe held for 28 consecutive days; the statement's closing date must be within 31 days of the \nvisa application (a 6-month statement is fine as long as it covers this)\n- 1 year academic/tuition fee (balance outstanding on CAS)\n- Living expenses for up to 9 months:\n London: £1,529/month = £13,761\n Outside London: £1,171/month = £10,539\n- From 30 Nov 2026 applications: London £1,570/month (£14,130); Outside London £1,203/month (£10,827)\n\n- Total funds required:\n London: outstanding tuition + £13,761 (£14,130 from 30 Nov 2026)\n Outside London: outstanding tuition + £10,539 (£10,827 from 30 Nov 2026)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- University Offer Letter\n- CAS (Confirmation of Acceptance for Studies)\n- Tuition Fee details and fee payment confirmation\n- Accommodation payment/details, if mentioned on CAS\n- ATAS Certificate, if applicable\nAny documents specifically referenced on the CAS, if required","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"TB Test Certificate from UKVI-approved Clinic","Academic and Language Testing Certificate":"English Language Test – IELTS / PTE / UKVI-approved, if applicable\nATAS Certificate, if required","HEALTH INSURANCE":"Was blank — filled: IHS covers NHS access. Covered through the Immigration Health \nSurcharge (IHS) — no separate private insurance required","Travel History":"Travel History – Last 10 Years","Passport SIze Coloured Photo":"Passport-Size Colour Photographs\n- Size: 35mm × 45mm\n- Background: Plain, light-coloured (preferably white)\n- Recent: Taken within the last 6 months","(PCC)":"Not required","Accommodation Documents":"Accommodation payment/details\n- Booking Confirmation/ Receipt","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Parental Consent Letter, if under 18 (Affidavit)\n- Sponsorship Letter / Affidavit\n- Student Aadhaar Card\n- Birth Certificate\n- cover letter"},{"_row":39,"country_id":"australia","Country":"Australia","flag":"🇦🇺","region":"UK & Pacific","Visa Type":"Student Visa","TAGS":"E-Visa (Student Visa Subclass 500 — ImmiAccount)","Visa Costs":"💰 Fee Bifurcation\n* Visa Application Charge: AUD 2,500 (≈ ₹1.45 lakh) — from 1 July 2026 (ELICOS/non-award: AUD 2,050)","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- Varies — check Home Affairs processing-time guide\n- Commonly 4–8 weeks for a complete file","Application Process":"Genuine Student (GS) requirement replaced GTE — answer the GS questions in the application. \nIndia is assessed at a high evidence level: full proof of funds and source is expected. Living-cost \nbenchmark AUD 29,710/year. Processing priority depends on the provider's status (Ministerial Direction 115).","Passport":"- Valid Passport (should cover the course duration)\n- Front & Back Pages\n- All old passports","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n- Gap explanation / experience letters (if study gap)","Bank Statement with Minimum Balance":"- Sponsor’s last 3–6 months’ bank statement (signed & stamped)\n- First-year tuition fee\n- Living expenses: AUD 29,710 (12 months, single applicant)\n- Travel costs (approx. AUD 2,000 from India)\n- Total funds required: 1st year tuition + AUD 29,710 + travel","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income\n- CA Report / Net-worth statement\n- Education loan disbursement proof (if applicable)","Flight Tickets and Accomodation Voucher":"Not required at application stage — book flights after visa approval\n- Temporary accommodation details (if requested)","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Confirmation of Enrolment (CoE)\n- Offer Letter from CRICOS-registered provider\n- Tuition fee payment receipt\n- Genuine Student (GS) question responses","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"Health Examination by Home Affairs panel physician (HAP ID) — chest X-ray + medical as instructed","Academic and Language Testing Certificate":"- IELTS / PTE / TOEFL / Cambridge (as per course & visa requirement)\n- GRE/GMAT only if required for admission","HEALTH INSURANCE":"Mandatory — Overseas Student Health Cover (OSHC) for the full visa duration","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs\n- Size: 45mm × 35mm\n- Background: Plain white / light\n- Recent: Taken within the last 6 months","(PCC)":"Required if requested by Home Affairs (common for older applicants / long courses)","Accommodation Documents":"Not mandatory\n- Accommodation details (supporting)","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Statement of Purpose / GS supporting statement\n- Resume / CV & work experience letters\n- Welfare arrangements / CAAW (if under 18)\n- Birth Certificate\n- Proof of ties to India"},{"_row":40,"country_id":"japan","Country":"Japan","flag":"🇯🇵","region":"East Asia","Visa Type":"Student Visa","TAGS":"Sticker Visa (Student — with Certificate of Eligibility)","Visa Costs":"💰 Fee Bifurcation\n* Visa Fee: ₹500 (single / multiple — concessional rate for Indians, confirmed after 1 July 2026)\n* VFS Service Fee: ₹800 (incl. GST)\n* Courier (optional): approx. ₹550","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- COE: approx. 1–3 months (filed by institution in Japan)\n- Visa after COE: approx. 5–10 working days at VFS","Application Process":"Japanese school/university must first obtain the Certificate of Eligibility (COE) from the Immigration \nServices Agency. COE is valid for 3 months — apply for the visa within this window. Residence card \nissued at the airport on arrival. VFS appointment mandatory.","Passport":"- Valid Passport\n- Front & Back Pages (photocopy of first & last page)\n- Minimum 6 Months Validity & at least 2 blank pages\n- All old passports","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required","Bank Statement with Minimum Balance":"- Sponsor’s last 6 months’ bank statement (signed & stamped)\n- Funds for 1 year tuition + living (commonly JPY 1.6–2 million ≈ ₹9.5–13 lakh)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Certificate of Eligibility (COE) — original / copy / e-COE print\n- Admission Letter from Japanese institution\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"Not required for visa (health checkup may be requested by institution)","Academic and Language Testing Certificate":"- JLPT / NAT-TEST / J-TEST (Japanese-taught or language school)\n- IELTS / TOEFL (English-taught programmes)","HEALTH INSURANCE":"Not required for visa (enrol in Japan's National Health Insurance after arrival)","Travel History":"Last 12 months travel history and all previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photograph\n- Size: 35mm × 45mm\n- Background: White\n- Recent: Taken within the last 6 months","(PCC)":"Not required","Accommodation Documents":"Accommodation payment/details\n- Booking Confirmation/ Receipt","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Visa Application Form (completed & signed)\n- Cover Letter\n- Language school students: additional documents as requested by Embassy\n- Parental Consent Letter, if under 18"},{"_row":41,"country_id":"southkorea","Country":"South Korea","flag":"🇰🇷","region":"East Asia","Visa Type":"Student Visa","TAGS":"Indian D-2/D-4 applicants normally file a sticker visa at VFS Korea; \ne-Visa is only possible when the university applies online. Please \nconfirm which one you offer. Sticker Visa (via VFS Korea)\nE-Visa only if the university applies through the Korea Visa Portal\n\nVisa Type: D-2 / D-4 Student Visa","Visa Costs":"CORRECTED visa fee to Embassy of Korea rates from 1 June 2025 (was ₹5,400 / ₹8,100). VFS fee could not be read from VFS site. \nSouth Korea Visa Fee Breakdown\n\n* Visa Fee (revised by Embassy of Korea from 1 June 2025): Single Entry (more than 90 days) ₹5,100 | Multiple Entry ₹7,650\n* VFS / KVAC Service Fee:  ₹1,600","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"4–6 Weeks","Passport":"- Valid Passport\n- Front & Back Pages\n- Minimum 6 Months Validity","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\nNote: Copy with Apostille Required\nAcademic Transcripts Required","Bank Statement with Minimum Balance":"Added: balance certificate must be issued within 30 days. - Sponsor’s last 6 months’ bank statement (singed & Stamped)\n- 1 year academic/tuition fee\nFinancial Requirement – South Korea\nD-2 – Degree Students\nSeoul/Capital Region: KRW 20,000,000 ≈ ₹12–13 lakh\nRegional University: KRW 16,000,000 ≈ ₹9–10 lakh\nD-4 – Korean Language/Training\nSeoul/Capital Region: KRW 10,000,000 ≈ ₹6–7 lakh\nRegional University: KRW 8,000,000 ≈ ₹5–5.5 lakh\nNote: The fund can vary/ depends on the course fee and university region\n\nBank balance certificate must be issued within 30 days of application (in KRW or USD)","Other Financial Documents":"- Individual: Personal or linear family member's ITR – Last 2 Years\n- Business: Personal or linear family member's ITR – Last 3 Years\n- Company's ITR – 3 Years (Optional)\nIf ITR is not available, provide an Explanation Letter\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment than 180 days)","Visa Costs":"China Visa Fee Breakdown\n\n* CVASC Service Fee – Normal: 2,107 INR | Express: 2,507 INR\n* Visa Fee: Single Entry 2,900 INR | Double Entry 4,400 INR | 6 Months Multiple 5,900 INR | 1 Year Multiple 8,800 INR","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"CHECK: 20–25 WD looks copied from your tourist row. X1/X2 files at CVASC are normally \ndecided in about 4–5 working days once complete. Keep your figure only if it includes \nuniversity/online approval time. 🕒 Regular: 20–25 Working Days\n⚡ Express: 10–15 Working Days\nNote: Visa processing time may vary depending on online approval.","Passport":"- Valid Passport\n- Front & Back Pages\n- Minimum 6 Months Validity","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required","Bank Statement with Minimum Balance":"- Sponsor’s last 6 months’ bank statement (singed & Stamped)\n- 1 year academic/tuition fee\n- Living expenses for atleast 1 Year\n- Total funds required:\n12 Lakh to 15 Lakh ( depending on the university’s tuition and accommodation fees.)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement","University offer letter/ Confirmation Documents":"CORRECTED — most important fix: the original Admission Notice and JW201/JW202 (or DQ for X2) \nwere missing. The visa centre will not accept an X1/X2 file without the originals. \n- ORIGINAL Admission Notice from Chinese university + copy (mandatory)\n- ORIGINAL JW201 / JW202 form (X1) or DQ form (X2) + copy (mandatory)\n- University Offer Letter\n- Tuition Fee details and fee payment confirmation\n- Accommodation payment/details","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"Added the blood tests the embassy expects. Medical Examination Record for Foreigners \n(mandatory for X1 Visa; recommended if required by the institution)\nIncl. blood tests (HIV, Hepatitis B/C, VDRL) with original lab reports","Academic and Language Testing Certificate":"Added NEET for MBBS. Not required\nNEET Scorecard (mandatory for Indian MBBS applicants)","HEALTH INSURANCE":"- Not Mandatory","Travel History":"Travel History – Last 12 Months\nShare Previous visa of china (If any)","Passport SIze Coloured Photo":"CORRECTED: China visa photos are 48mm × 33mm (not 35 × 45). \nPassport-Size Colour Photograph (China visa spec)\n- Size: 48mm × 33mm\n- Background: White\n- No glasses, neutral expression\n- Recent: Taken within the last 6 months","(PCC)":"Police Clearance Certificate (if requested by the institution/Consulate)","Accommodation Documents":"Accommodation payment/details\n- Booking Confirmation/ Receipt","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"Parental Consent Letter, if under 18 (Affadabit preferable not mandtory)\nSponsorship Letter / (Affadabit preferable not mandtory)\nStudent Aadhaar Card\nBirth Certificate\nSponsor's ID Proof (if applicable)\nAadhaar Card & PAN Card (recommended)\n\nAfter arrival (X1): register accommodation with police within 24 hrs; convert \nto Residence Permit within 30 days"},{"_row":43,"country_id":"phillipines","Country":"Phillipines","flag":"🇵🇭","region":"Southeast Asia","Visa Type":"Student Visa","TAGS":"Sticker Visa (9F Student Visa) — or 9A entry visa converted to 9F in the Philippines","Visa Costs":"💰 Fee Bifurcation\n* 9A Visa (entry, for conversion to 9F): ₹2,560 regular — demand draft to Embassy of the Philippines\n* 9F conversion / Bureau of Immigration fees in the Philippines: PHP 10,000 + $ 50 ACR I-Card","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- 9F (direct): DFA authority to issue + embassy interview — approx. 4–8 weeks\n- 9A visa: at least 2 working days after submission & interview","Application Process":"Two routes: (1) 9F issued by the embassy after the university's liaison officer lodges the NOA with \nDFA Manila; or (2) enter on a 9A visa and convert to 9F in the Philippines. Medicine/Dentistry students \nneed a CHED Certificate of Eligibility for Admission (CEA). Police clearance and medical certificate must \nbe apostilled.","Passport":"- Valid Passport\n- Front & Back Pages\n- Minimum 6 Months Validity beyond authorised stay","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Sponsor’s last 6 months’ bank statement (signed & stamped)\n- Funds for 1 year tuition + living costs (commonly ₹6–8 lakh)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income\n- Affidavit of Support from sponsor","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Original Notice of Acceptance (NOA) with school's dry seal\n- CHED Certificate of Eligibility for Admission (CEA) — Medicine / Dentistry\n- Endorsement letter from university to DFA (arranged by university)\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"Apostilled Medical Certificate (from NABH-listed hospital) — incl. chest X-ray, \nblood, urine & stool reports (FA Form 11 format)","Academic and Language Testing Certificate":"- NEET Scorecard (mandatory for Indian MBBS applicants)\n- English proficiency as per university","HEALTH INSURANCE":"Recommended — health insurance for the stay","Travel History":"Last 12 months travel history and all previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs\n- Size: 2 × 2 inch / 35mm × 45mm (as per embassy form)\n- Background: White\n- Recent: Taken within the last 6 months","(PCC)":"MANDATORY — Apostilled Regional Passport Office Police Clearance (not older than 6 months)","Accommodation Documents":"Accommodation payment/details\n- Booking Confirmation/ Receipt","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Visa Application Form\n- Personal History Statement\n- Formal request letter to the Consular Section (for 9A route)\n- Birth Certificate (apostilled)\n- Parental Consent Letter, if under 18"},{"_row":44,"country_id":"Newzealand","Country":"Newzealand","flag":"🇳🇿","region":"Oceania","Visa Type":"Student Visa","TAGS":"E-Visa","Visa Costs":"💰 Fee Bifurcation\n* Student Visa Fee: NZD 750 (≈ ₹39,000) — includes IVL\n* No VFS fee for online application (biometrics / passport only if requested)\n* Insurance: approx. NZD 400–700/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"* Approximately 6–12 weeks after submission of a complete application.\n* Processing time may vary depending on the Consulate/Embassy and the individual case.","Passport":"- Valid Passport\n(issued within the last 10 years, valid with at least 2 blank pages)\n- Front & Back Pages\n- Minimum 6 Months Validity","Academic Transcripts":"For Bachelor's Applicants:\n* 10th Marksheet & Certificate\n* 12th Marksheet & Certificate\nFor Master's Applicants:\n* Bachelor's Degree Certificate\n* Complete Academic Transcripts / Marksheets\nFor PhD Applicants:\n* Master's Degree Certificate\n* Academic Transcripts\n* Research Proposal / Research Documents","Bank Statement with Minimum Balance":"🏦 Bank Account Statements:\nOriginal personal or sponsor bank statements for the last 6 months, stamped and \nsigned by the bank, demonstrating consistent and liquid funds without sudden large \ndeposits. Minimum requirement is 10-12 lakhs INR per year excluding the university fee","Other Financial Documents":"Removed the unverified 'NZD 25,000 internal INZ benchmark' line — INZ's published \nfigure is NZD 20,000/year. * Bank Balance Certificate (6 Months with stamping 2 days \nprior to submission)\n* Income Proof (if applicable)\n* Loan disbursement & sanction letter (if applicable)\n* University Fee payment proof\nNZD 20,000/year living expenses (INZ official) + full first-year tuition + return airfare. \nStable funds for 3+ months minimum. Sudden large deposits flagged.","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement","University offer letter/ Confirmation Documents":"Unconditional Offer of Place from NZQA-approved institution (conditional offers = rejection)","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Was blank — filled 'Not required'. Not required","Medical Examination (if required)":"CORRECTED: a chest X-ray is already needed for stays over 6 months from India; \nthe full medical applies over 12 months. The old text implied nothing was needed \nunder 12 months. - Chest X-ray (INZ 1096) — required if staying more than 6 months \n(India is a TB-screening country)\n- Full General Medical (INZ 1007) + chest X-ray — if staying more than 12 months\n- From an INZ panel physician (eMedical)","Academic and Language Testing Certificate":"IELTS/PTE required at university admission stage only — not re-checked by INZ. \nUnconditional offer letter is the proxy. Bachelor's: IELTS 6.0–6.5; Master's: 6.5–7.0.","HEALTH INSURANCE":"Mandatory — covers full stay. No reciprocal healthcare agreement between India and NZ. \nUniversity-provided insurance (NZD 400–700/year) is safest — pre-vetted by INZ. \nIndian insurers (Tata AIG, HDFC Ergo) accepted if policy explicitly covers NZ.","Travel History":"Last 12 months travel history and all previous visas copy (if any)","Passport SIze Coloured Photo":"Most recent photograph not older than 6 months\n35x45mm\n80% face and white background","(PCC)":"Required for courses >24 months or if INZ requests. In practice, \nBachelor's programs (3–4 years) commonly trigger PCC request. \nRPO PCC via Passport Seva (3–7 days). No apostille required by INZ.","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card\nOR\n* Utility Bill (not older than 6 months)\nOR\n* Rental Agreement\nOR\n* Property Ownership Documents\nOR\n* Other Government-issued Residence Proof","Additional Supporting Documents":"* Statement of Purpose /* ---------------- utils ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr = s => esc(s).replace(/\n/g,' ');
const inr = n => (n == null || isNaN(n)) ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const inr2 = n => '₹' + (Math.round((n||0) * 100) / 100).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
const r2 = n => Math.round(n * 100) / 100;
const uniq = a => [...new Set(a)];
const clone = o => JSON.parse(JSON.stringify(o));
const TODAY = new Date();
const fmtDate = d => d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
const fmtShort = d => d.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
function addWorkingDays(date, n){ const d = new Date(date); let added = 0; n = Math.ceil(n); while (added < n){ d.setDate(d.getDate()+1); const w = d.getDay(); if (w !== 0 && w !== 6) added++; } return d; }
function hashStr(s){ let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) | 0; return Math.abs(h); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function toast(title, msg = '', kind = 'info'){
  const icon = {ok:'fa-circle-check', warn:'fa-triangle-exclamation', err:'fa-circle-xmark', info:'fa-circle-info'}[kind] || 'fa-circle-info';
  const col = {ok:'var(--ok)', warn:'var(--warn)', err:'var(--err)', info:'var(--brand)'}[kind];
  const el = document.createElement('div'); el.className = 'toast'; el.style.opacity = 0; el.style.transform = 'translateY(8px)';
  el.innerHTML = `<i class="fa-solid ${icon} mt-0.5" style="color:${col}"></i><div><div class="font-semibold text-[13px]">${esc(title)}</div>${msg ? `<div class="text-xs muted mt-0.5">${esc(msg)}</div>` : ''}</div>`;
  $('toasts').appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = 1; el.style.transform = 'none'; });
  setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 3800);
}

const PLACEHOLDER_PHRASES = [
  "The web view of your sheet stopped partway through this row, so I couldn't see your own text for this cell. I've filled it with the standard requirement — replace it with yours if you already had something here.",
  "Your text here was cut off after '- APS required' in the view I could access — check the rest against your original."

const PLACEHOLDER_RES = PLACEHOLDER_PHRASES.map(p => new RegExp(p.split(/\s+/).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/'/g, "['’]")).join('\\s+'), 'gi'));
function cleanText(t){
  let s = String(t ?? ''), removed = 0;
  for (const re of PLACEHOLDER_RES){ s = s.replace(re, () => { removed++; return ''; }); }
  s = s.replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  return { text: s, removed };

/* ---------------- money / tat parsing ---------------- */
const CUR_ALIASES = { '₹':'INR', 'RS':'INR', 'INR':'INR', '€':'EUR', 'EUR':'EUR', 'EURO':'EUR', 'EUROS':'EUR', '£':'GBP', 'GBP':'GBP', '$':'USD', 'USD':'USD', 'AED':'AED', 'CAD':'CAD', 'AUD':'AUD', 'NZD':'NZD', 'BHD':'BHD', 'MAD':'MAD', 'CZK':'CZK', 'DKK':'DKK', 'NOK':'NOK', 'SEK':'SEK', 'PHP':'PHP' };
const CUR_WORDS = 'AED|USD|EUROS|EURO|EUR|GBP|CAD|AUD|NZD|BHD|MAD|INR|CZK|DKK|NOK|SEK|PHP';
const RE_PREFIX = new RegExp(`(₹|€|£|\\$|\\b(?:${CUR_WORDS})\\b)\\s?(\\d[\\d,]*(?:\\.\\d+)?)(\\s*lakh)?`, 'gi');
const RE_SUFFIX = new RegExp(`(\\d[\\d,]*(?:\\.\\d+)?)\\s?(₹|€|\\b(?:${CUR_WORDS})\\b)`, 'gi');
function moneyTokens(line){
  const toks = [];
  for (const m of line.matchAll(RE_PREFIX)){ let v = parseFloat(m[2].replace(/,/g, '')); if (m[3]) v *= 100000; toks.push({ i:m.index, end:m.index + m[0].length, cur:CUR_ALIASES[m[1].toUpperCase()] || 'INR', v }); }
  for (const m of line.matchAll(RE_SUFFIX)){
    if (toks.some(t => m.index < t.end && m.index + m[0].length > t.i)) continue;
    toks.push({ i:m.index, end:m.index + m[0].length, cur:CUR_ALIASES[m[2].toUpperCase()] || 'INR', v:parseFloat(m[1].replace(/,/g, '')) });
  }
  const ap = line.match(/appointment fee\s*[-:]\s*(\d[\d,]*)\s*(euros?|eur)?/i);
  if (ap && !toks.length) toks.push({ i:ap.index, end:ap.index + ap[0].length, cur:ap[2] ? 'EUR' : 'INR', v:parseFloat(ap[1].replace(/,/g, '')) });
  return toks.sort((a, b) => a.i - b.i);
}
function toINR(tok, fx){ return tok.v * (fx[tok.cur] ?? 1); }
const EXTRA_KW = /(fee|charge|vfs|appointment|logistic|cvasc|biometric|notary)/i;
const EXTRA_EXCL = /(optional|courier|lounge|sms|insurance|paper application|urgent|express|priority|double|multiple|6 months|1 year|assurance)/i;
/* Estimate the INR embassy/government cost from the free-text "Visa Costs" cell. */
function parseGovtCost(text, fx){
  const raw = String(text || '').trim();
  if (!raw) return { inr:null, approx:false, variants:false, basis:'empty' };
  if (/^free\b/i.test(raw)) return { inr:0, approx:false, variants:false, basis:'Free' };
  let lines = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const stop = lines.findIndex(l => /^(other costs|optional\b|additional charges)/i.test(l.replace(/^[*\-•\s]+/, '')));
  if (stop > 0) lines = lines.slice(0, stop);
  lines = lines.filter(l => !/^(corrected|check)\b/i.test(l));
  const anyTok = lines.some(l => moneyTokens(l).length);
  let primary = null, extras = [], variants = false, approx = false, basis = [];
  for (const l of lines){
    let toks = moneyTokens(l);
    if (!toks.length && primary === null){ const m = [...l.matchAll(/(\d[\d,]{2,})/g)].find(x => !/^(19|20)\d\d$/.test(x[1]) && parseFloat(x[1].replace(/,/g, '')) >= 100); if (m) toks = [{ i:m.index, cur:'INR', v:parseFloat(m[1].replace(/,/g, '')) }]; }
    if (!toks.length) continue;
    const inrTok = toks.find(t => t.cur === 'INR');
    if (primary === null){
      const t = inrTok || toks[0]; primary = toINR(t, fx); if (t.cur !== 'INR') approx = true;
      basis.push(t.cur === 'INR' ? `₹${t.v.toLocaleString('en-IN')}` : `${t.cur} ${t.v} × ${fx[t.cur]}`);
      continue;
    }

    const ctx = before.trim() ? before : l;

      const t = inrTok && inrTok.i - first.i < 40 ? inrTok : first; extras.push(toINR(t, fx)); if (t.cur !== 'INR') approx = true;
      basis.push(t.cur === 'INR' ? `+ ₹${t.v.toLocaleString('en-IN')}` : `+ ${t.cur} ${t.v} × ${fx[t.cur]}`);
    } else variants = true;
  }
  if (primary === null) return { inr:null, approx:false, variants:false, basis:'unparsed' };
  return { inr:Math.round(primary + extras.reduce((a, b) => a + b, 0)), approx, variants, basis:basis.join(' ') };
}
function parseFee(text){
  const nums = (String(text || '').match(/\d[\d,]*/g) || []).map(n => parseFloat(n.replace(/,/g, ''))).filter(n => n >= 10);
  if (!nums.length) return null;
  return nums.length >= 2 ? Math.round((nums[0] + nums[1]) / 2) : nums[0];
}
function parseSelling(text){
  const s = String(text || '').trim(); if (!s) return null;
  const child = (s.match(/₹\s?([\d,]+)\s*\(child\)/i) || [])[1];
  const lines = s.split('\n').map(x => x.trim()).filter(Boolean);
  for (const l of lines){
    const amts = [];
    for (const m of l.matchAll(/(₹\s?)?(\d[\d,]*)(\s*(?:INR|days?|months?))?/gi)){
      const v = parseFloat(m[2].replace(/,/g, '')); const unit = (m[3] || '').toLowerCase();
      if (/day|month/.test(unit)) continue; if (!m[1] && v < 500) continue; amts.push(v);
    }
    if (amts.length){
      const range = /\d\s*[-–]\s*₹?\s*\d/.test(l) && amts.length >= 2;
      return { from:amts[0], to:range ? Math.max(amts[0], amts[1]) : null, child:child ? parseFloat(child.replace(/,/g, '')) : null, multiLine:lines.length > 1 };
    }

function parseTAT(text){
  const s = String(text || '').toLowerCase().replace(/\s+/g, ' ');
  if (!s.trim()) return null;
  if (/varies/.test(s.slice(0, 60))) return null;
  const express = /express|urgent|priority|fast-track|same day|hours/.test(s);
  if (/same day/.test(s)) return { min:0, max:0.5, express:true };
  const m = s.match(/(\d+(?:\.\d+)?)\s*(?:(?:–|-|—|to)\s*(\d+(?:\.\d+)?))?\s*(working days?|wd\b|business days?|calendar days?|days?|weeks?|months?|hours?|hrs?)/);
  if (!m) return null;
  let a = parseFloat(m[1]), b = m[2] ? parseFloat(m[2]) : a; const u = m[3];
  const k = /working|wd|business/.test(u) ? 1 : /week/.test(u) ? 5 : /month/.test(u) ? 21 : /hour|hr/.test(u) ? 0.1 : 5 / 7;
  a = Math.max(0.5, Math.round(a * k * 10) / 10); b = Math.max(a, Math.round(b * k * 10) / 10);

      sheetIssues.push({ type:'empty_sheet', sev:'err', msg:`Sheet "${def.sheet}" has headers but no data rows.` + (def.cat === 'Opportunity Card' ? ' A flagged DRAFT listing (Germany Opportunity Card) is shown so the category stays live — replace it by filling the sheet.' : '') });

  if (gc.inr == null) add('govt_unparsed', 'warn', 'Embassy cost could not be read as a number from "Visa Costs" — B2B/B2C prices derived from service fees only.');
  else if (gc.approx) add('govt_fx', 'info', `Embassy cost converted from foreign currency (${gc.basis}).`);
  p.b2b_fee = parseFee(p.b2b_fee_raw); p.b2c_fee = parseFee(p.b2c_fee_raw);
  const sell = parseSelling(p.b2c_sell_raw);
  p.b2c_to = null; p.child_price = null;
  if (sell){ p.b2c_price = sell.from; p.b2c_to = sell.to; p.child_price = sell.child; p.priceSource = 'sheet'; if (sell.multiLine) p.variants = true; }
  else { p.b2c_price = (p.govt ?? 0) + (p.b2c_fee ?? 0); p.priceSource = 'computed'; add('b2c_sell_missing', 'info', `"B2C Selling Price" empty — computed as embassy cost + B2C service fee (${inr(p.govt)} + ${inr(p.b2c_fee)}).`); }

  if (b2bSell) p.b2b_price = b2bSell.from;
  else {
    p.b2b_price = p.govt != null ? p.govt + (p.b2b_fee ?? 0) : Math.max(0, p.b2c_price - (p.b2c_fee ?? 0) + (p.b2b_fee ?? 0));
    add('b2b_sell_missing', 'info', '"B2B Selling Price" empty — computed as embassy cost + B2B service fee.');
  }

  ['govt','b2b_price','b2c_price','child_price'].forEach(k => { if (o[k] != null && o[k] !== '') p[k] = Number(o[k]); });

/* ====================== INVOICE / TAX INVOICE / PI ENGINE ======================
   Layout replicates "Leverage Visas Invoice 2026-27.xlsx":
   · INVOICE (default, no GST)  — sheet "Manual Invoice":  Sr | Country | Visa Category | Sale Price | Qty | Total
   · TAX INVOICE (admin only)   — sheet "Leverage Edu TAX INVOICE": Sr | Country | Visa Category | Sale Price | Cost Price | Service Charge | Gst | Qty | Total
       Service Charge = (Sale − Cost) / 1.18 · Gst = Service Charge × 18% · Total = Sale × Qty   (GST is inside the sale price)
   · PI (proforma)              — same as INVOICE, titled PROFORMA INVOICE
   One document per booking Reference ID (all travellers on that ref become line items with Qty). Documents are deep-frozen once generated. */
const DOC_LABEL = { INV:'Invoice (no GST)', TAX:'Tax Invoice (GST)', PI:'Proforma Invoice (PI)' };
const DOC_TITLE = { INV:'INVOICE', TAX:'TAX INVOICE', PI:'PROFORMA INVOICE' };
function groupFor(app){
  if (!app.ref || app.ref === '—') return [app];
  const who = app.agentKey || app.agent;
  return STATE.apps.filter(a => a.ref === app.ref && (a.agentKey || a.agent) === who);
}
function partyForAgent(ag){
  const sc = ag.stateCode || Object.keys(GST_STATES).find(k => GST_STATES[k].toUpperCase() === String(ag.state || ag.region || '').toUpperCase()) || '';
  return { key:ag.key, name:ag.regName || ag.name, tradeName:ag.name, gstin:ag.gstin, stateCode:sc, stateName:GST_STATES[sc] || ag.state || '', address:[ag.address.replace(/\n+/g, ', '), ag.city].filter(Boolean).join(', '), email:ag.email, kind:'B2B' };
}
function partyFor(app){
  if (app.channel === 'B2B'){ const ag = STATE.agents.find(a => a.key === app.agentKey); if (ag) return partyForAgent(ag); }
  const C = STATE.customer; const me = app.agent === C.name;
  return { key:'b2c:' + (me ? C.name : app.name), name:me ? C.name : app.name, gstin:'', stateCode:me ? C.stateCode : '', stateName:me ? C.state : '', address:me ? C.state : '', email:me ? C.email : '', kind:'B2C' };
}
function linesFor(apps){
  const m = {};
  apps.forEach(a => { const q = a.pax || 1; const sale = r2(a.sale / q), cost = r2((a.cost || 0) / q);
    const country = (a.countryRaw || a.country || '').toUpperCase(); const category = a.category || a.productLabel;
    const k = [country, category, sale, cost].join('|'); (m[k] = m[k] || { country, category, sale, cost, qty:0 }).qty += q; });
  return Object.values(m);
}
function calcDoc(lines, type){
  const rate = STATE.settings.gstRate / 100;
  const L = lines.map(l => { const service = r2(Math.max(0, l.sale - l.cost) / (1 + rate)); const gst = r2(service * rate); return { ...l, service, gst, total:r2(l.sale * l.qty) }; });
  const sum = k => r2(L.reduce((s, l) => s + (k === 'total' ? l.total : l[k] * l.qty), 0));
  return { lines:L, totals:{ total:sum('total'), qty:L.reduce((s, l) => s + l.qty, 0), cost:sum('cost'), service:type === 'TAX' ? sum('service') : 0, gst:type === 'TAX' ? sum('gst') : 0 }, gstRate:STATE.settings.gstRate };
}
function nextDocNo(type, ref){
  const taken = no => STATE.invoices.some(d => d.type === type && d.no === no);
  if (ref && ref !== '—'){ let no = type === 'PI' ? `PI-${ref}` : ref; let n = 2; while (taken(no)) no = `${type === 'PI' ? 'PI-' : ''}${ref}-${n++}`; return no; }
  if (type === 'PI'){ STATE.piSeq++; return `PI/26-27/${String(STATE.piSeq).padStart(4, '0')}`; }
  STATE.invSeq++; return `LV/26-27/${type}/${String(STATE.invSeq).padStart(4, '0')}`;
}
function deepFreeze(o){ Object.values(o).forEach(v => { if (v && typeof v === 'object' && !Object.isFrozen(v)) deepFreeze(v); }); return Object.freeze(o); }
function issueDoc({ type, apps, ctx, party, channel, agentKey, ref, lines, remarks }){
  const c = calcDoc(lines, type); const now = new Date().toISOString();
  const doc = deepFreeze({ no:nextDocNo(type, ref), type, gst:type === 'TAX', date:now, lockedAt:now, ref, appIds:apps.map(a => a.id), channel, agentKey:agentKey || null, ctx,
    party, lines:c.lines, totals:c.totals, gstRate:c.gstRate, remarks:remarks || '', travellers:apps.map(a => a.name) });
  STATE.invoices.unshift(doc);
  apps.forEach(a => { if (!a.docs) a.docs = {}; Object.defineProperty(a.docs, type, { value:doc.no, writable:false, enumerable:true, configurable:false }); });
  return doc;
}
function issueForApp(app, type, ctx){
  const g = groupFor(app);
  if (app.docs?.[type]) return STATE.invoices.find(d => d.no === app.docs[type] && d.type === type);
  return issueDoc({ type, apps:g, ctx, party:partyFor(app), channel:app.channel, agentKey:app.agentKey, ref:app.ref, lines:linesFor(g) });
}
function numWords(n){
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  let rup = Math.floor(n), paise = Math.round((n - rup) * 100); if (!rup && !paise) return 'Zero';
  const parts = []; const cr = Math.floor(rup / 1e7); rup %= 1e7; const lk = Math.floor(rup / 1e5); rup %= 1e5; const th = Math.floor(rup / 1e3); rup %= 1e3;
  if (cr) parts.push(three(cr) + ' Crore'); if (lk) parts.push(two(lk) + ' Lakh'); if (th) parts.push(two(th) + ' Thousand'); if (rup) parts.push(three(rup));
  return 'Rupees ' + parts.join(' ') + (paise ? ' and ' + two(paise) + ' Paise' : '') + ' Only';
}

  { k:'card', label:'Credit / debit card', icon:'fa-credit-card', sub:'Visa, Mastercard, RuPay, Amex' },

function luhn(n){ let s = 0, alt = false; for (let i = n.length - 1; i >= 0; i--){ let d = +n[i]; if (alt){ d *= 2; if (d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; }

let PAYCTX = null;   // { opts, onPay }
function refreshPay(){ const host = $('pay-host'); if (host && PAYCTX) host.innerHTML = paySelector(PAYCTX.opts); }
function readPayment(amount){
  const m = STATE.ui.payMethod;
  if (m === 'wallet') return { method:'wallet', status:'Fully Paid (Wallet)' };
  if (m === 'card'){ const n = ($('pay-card').value || '').replace(/\D/g, ''); const exp = $('pay-exp').value.trim();
    if (n.length < 13 || !luhn(n)) return { err:'Check the card number.' };
    const mm = +exp.slice(0, 2), yy = +exp.slice(3, 5); const now = new Date(); if (!/^\d{2}\/\d{2}$/.test(exp) || mm < 1 || mm > 12 || (2000 + yy) * 12 + mm < now.getFullYear() * 12 + now.getMonth() + 1) return { err:'Card expiry is invalid or in the past.' };

}

function decideRefund(rid, ok){
  const r = STATE.refunds.find(x => x.id === rid); const amt = Math.round(+($('rfa-' + rid)?.value || r.amount)); const note = ($('rfn-' + rid)?.value || '').trim();
  if (ok && (amt < 1 || amt > r.sale)) return toast('Check the approved amount', `Up to ${inr(r.sale)}.`, 'warn');
  if (!ok && !note) return toast('Add a note', 'Tell the agent why the refund is rejected.', 'warn');
  r.status = ok ? 'Approved' : 'Rejected'; r.approved = ok ? amt : 0; r.decisionNote = note; r.decidedAt = ymd(new Date()); r.decidedBy = AUTH.session?.name || 'Admin';
  const a = STATE.apps.find(x => x.id === r.appId);
  if (ok){ STATE.wallets[r.agentKey] = (STATE.wallets[r.agentKey] || 0) + amt; (STATE.ledger[r.agentKey] = STATE.ledger[r.agentKey] || []).unshift({ ts:new Date(), type:'credit', amt, note:`Refund ${r.id} · ${r.traveller} · ${r.reason}`, ref:r.ref });
    if (a){ a.status = 'Cancelled'; a.payment = amt >= a.sale ? 'Refunded to wallet' : `Partly refunded to wallet (${inr(amt)})`; } }
  toast(ok ? 'Refund approved' : 'Refund rejected', ok ? `${inr(amt)} credited to ${STATE.agents.find(x => x.key === r.agentKey)?.name || 'agent'} wallet` : r.id, ok ? 'ok' : 'warn'); adminRefunds();
}
function refundTable(list, admin){

function vendorOf(x){ return x.agentKey ? (STATE.agents.find(a => a.key === x.agentKey)?.name || x.agent) : (x.party?.name || x.agent || x.name); }
function invFilterDocs(){
  const F = STATE.ui.inv; const q = F.q.trim().toLowerCase(); const v = F.vendor.trim().toLowerCase();
  return STATE.invoices.filter(d => (F.type === 'ALL' || d.type === F.type)
    && (!v || [d.party.name, d.party.tradeName, vendorOf(d)].join(' ').toLowerCase().includes(v))
    && (!F.from || d.date.slice(0, 10) >= F.from) && (!F.to || d.date.slice(0, 10) <= F.to)
    && (!q || [d.no, d.ref, d.party.name, d.party.tradeName, d.party.gstin, d.remarks, ...(d.travellers || []), ...d.lines.map(l => l.country + ' ' + l.category)].join(' ').toLowerCase().includes(q)));
}
function invPendingGroups(type){
  const F = STATE.ui.inv; const q = F.q.trim().toLowerCase(); const v = F.vendor.trim().toLowerCase(); const seen = new Set(); const out = [];
  STATE.apps.forEach(a => {
    if (a.docs?.[type] || /draft|cancel/i.test(a.status) || !a.sale) return;
    const k = a.ref !== '—' ? a.ref + '|' + (a.agentKey || a.agent) : a.id; if (seen.has(k)) return; seen.add(k);
    const g = groupFor(a).filter(x => !x.docs?.[type]); const vendor = a.channel === 'B2B' ? vendorOf(a) : a.name;
    const date = String(a.received || '').slice(0, 10);
    if (v && !String(vendor).toLowerCase().includes(v)) return;
    if (F.from && date && date < F.from) return; if (F.to && date && date > F.to) return;
    if (q && ![a.ref, vendor, a.country, a.countryRaw, a.category, ...g.map(x => x.name + ' ' + x.passport)].join(' ').toLowerCase().includes(q)) return;
    out.push({ k, app:a, g, vendor, date, total:g.reduce((s, x) => s + x.sale, 0) });
  });
  return out;

const KYC_MAX = 5 * 1024 * 1024; const KYC_OK = /\.(pdf|jpe?g|png)$/i;

    </div>`; }).join('');

const KYC_FORMS = {};   // prefix → { store, agentKey|null }
function kycStore(prefix){ return KYC_FORMS[prefix].store; }

    <div class="card p-5 lg:col-span-2"><div class="display font-bold mb-1">Invoice header, bank & footer</div><div class="text-xs muted mb-4">Pre-filled from “Leverage Visas Invoice 2026-27.xlsx”. Place of supply is taken from the billed-to GSTIN state code.</div>
      <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        ${[['name', 'Legal name'], ['formerly', 'Formerly line'], ['address1', 'Address line 1'], ['address2', 'Address line 2'], ['gstin', 'GSTIN'], ['stateCode', 'State code'], ['stateName', 'State'], ['email', 'Footer email'], ['website', 'Website']].map(([k, l]) => `<div><label class="label">${l}</label><input class="input" value="${attr(co[k])}" onchange="STATE.settings.company['${k}']=this.value"></div>`).join('')}
        ${[['beneficiary', 'Beneficiary'], ['bank', 'Bank'], ['type', 'Account type'], ['account', 'Account number'], ['ifsc', 'IFSC'], ['upi', 'UPI ID']].map(([k, l]) => `<div><label class="label">${l}</label><input class="input" value="${attr(co.bank[k])}" onchange="STATE.settings.company.bank['${k}']=this.value"></div>`).join('')}
        <div class="sm:col-span-2 lg:col-span-4"><label class="label">Footer note</label><input class="input" value="${attr(co.note)}" onchange="STATE.settings.company.note=this.value"></div>
      </div></div>
  </div>`;
}
function loadSheetJS(){ return window.XLSX ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load SheetJS')); document.head.appendChild(s); }); }
function sheetToRaw(ws, headerRow, dataStart){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  const hdr = (rows[headerRow - 1] || []).map(h => String(h ?? '').trim()); const seen = {}; const H = hdr.map(h => { if (!h) return null; if (seen[h]){ seen[h]++; return `${h} (${seen[h]})`; } seen[h] = 1; return h; });
  const val = v => v instanceof Date ? v.toISOString().slice(0, 10) : (typeof v === 'number' && Number.isInteger(v) ? String(v) : String(v ?? '').replace(/\r/g, '').trim());
  const out = [];
  rows.slice(dataStart - 1).forEach((r, i) => { const vals = H.map((_, j) => val(r[j])); if (!vals.slice(0, 5).some(Boolean)) return; const o = { _row:dataStart + i }; H.forEach((h, j) => { if (h) o[h] = vals[j]; }); out.push(o); });
  return { headers:H.filter(Boolean), rows:out };
}
async function importExcel(files){
  const log = $('imp-log'); log.innerHTML = 'Loading parser…';
  try {
    await loadSheetJS(); const raw = clone(STATE.raw); const got = [];
    for (const f of files){
      const wb = XLSX.read(await f.arrayBuffer(), { cellDates:true });
      for (const name of wb.SheetNames){
        const ws = wb.Sheets[name];
        if (SHEET_DEFS.some(d => d.sheet === name)){ raw[name] = sheetToRaw(ws, 1, 3); got.push(`${name}: ${raw[name].rows.length} rows`); }
        else if (name === 'Master Tracker'){ const t = sheetToRaw(ws, 1, 2); t.rows = t.rows.filter(r => r.Country); raw[name] = t; got.push(`${name}: ${t.rows.length} rows`); }
        else if (name === 'Source Data'){ const t = sheetToRaw(ws, 1, 2); t.rows = t.rows.filter(r => r.Country); raw['Master Tracker'] = t; got.push(`Source Data → tracker: ${t.rows.length} rows`); }
        else if (name.toLowerCase() === 'partners'){ const t = sheetToRaw(ws, 1, 2); t.rows = t.rows.filter(r => r['Agent Name']); raw['Partners'] = t; got.push(`partners: ${t.rows.length} agents`); }
        else if (name === 'Agent Mapping'){ const t = sheetToRaw(ws, 1, 2); t.rows = t.rows.filter(r => r['Agent Name']); raw[name] = t; got.push(`${name}: ${t.rows.length} agents`); }
      }
    }
    if (!got.length){ log.innerHTML = '<span style="color:var(--err)">No recognised sheets found.</span>'; return; }
    ingest(raw); log.innerHTML = '<b style="color:var(--ok)">Imported</b> — ' + got.map(esc).join(' · '); toast('Excel imported', got.join(' · '), 'ok');
  } catch (e){ log.innerHTML = `<span style="color:var(--err)">${esc(e.message)}</span>`; }
}
function importJSON(){ try { const j = JSON.parse($('json-in').value); if (!j || typeof j !== 'object') throw new Error('Not an object'); ingest({ ...STATE.raw, ...j }); toast('JSON applied', `${STATE.products.length} products loaded`, 'ok'); adminSettings(); } catch (e){ toast('Invalid JSON', e.message, 'err'); } }
function resetData(){ STATE.products = []; ingest(clone(EMBEDDED_RAW)); toast('Reset', 'Embedded master data restored', 'ok'); adminSettings(); }
function download(name, text, type = 'text/csv'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportCSV(name, rows){
  if (!rows.length) return; const cols = Object.keys(rows[0]).filter(k => typeof rows[0][k] !== 'object' || rows[0][k] === null);
  const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  download(`${name}.csv`, '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\n'));
}
