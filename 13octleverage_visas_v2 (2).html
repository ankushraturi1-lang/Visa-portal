<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leverage Visas V2 — Discovery, B2C, B2B & Ops Platform</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6fb; --surface:#ffffff; --surface-2:#f1f0f7; --surface-3:#e9e7f3; --border:#e4e2ee; --border-2:#d5d2e3;
  --text:#16142b; --text-2:#3b3956; --muted:#6c6a86; --faint:#9a98b0;
  --brand:#5b3df5; --brand-2:#7a5cff; --brand-ink:#3c22c9; --brand-soft:#efebff; --brand-softer:#f7f5ff;
  --ok:#0b8f60; --ok-soft:#e5f6ee; --warn:#a85f00; --warn-soft:#fff3df; --err:#c7303b; --err-soft:#fdecee; --info:#1d64d8; --info-soft:#e8f0fe;
  --shadow:0 1px 2px rgba(22,20,43,.05),0 4px 16px rgba(22,20,43,.06); --shadow-lg:0 12px 40px rgba(22,20,43,.14);
  --radius:16px;
}
:root[data-theme="dark"]{
  --bg:#0d0c17; --surface:#16152a; --surface-2:#1d1c35; --surface-3:#26244a; --border:#2a2848; --border-2:#3a3760;
  --text:#f1f0fa; --text-2:#cfcde6; --muted:#9a97bb; --faint:#6f6c92;
  --brand:#8a72ff; --brand-2:#a08dff; --brand-ink:#c3b8ff; --brand-soft:#262052; --brand-softer:#1b1838;
  --ok:#3fd19a; --ok-soft:#10352a; --warn:#ffb547; --warn-soft:#3a2a0e; --err:#ff6b75; --err-soft:#3d151b; --info:#79a8ff; --info-soft:#14264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
h1,h2,h3,.display{font-family:'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.muted{color:var(--muted)}.faint{color:var(--faint)}.t2{color:var(--text-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pre{white-space:pre-line}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-flat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.soft{background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
.lg-hide-fix{}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;border-radius:11px;padding:9px 16px;border:1px solid transparent;cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1.2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover:not(:disabled){background:var(--brand-ink)}
:root[data-theme="dark"] .btn-primary:hover:not(:disabled){background:var(--brand-2)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text-2)}.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-soft{background:var(--brand-soft);color:var(--brand-ink)}.btn-soft:hover{filter:brightness(.97)}
.btn-ok{background:var(--ok);color:#fff}.btn-sm{padding:6px 11px;font-size:12px;border-radius:9px}.btn-xs{padding:4px 8px;font-size:11px;border-radius:7px}
.input,.select,textarea.input{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border-2);border-radius:11px;padding:9px 12px;font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
.input:focus,.select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;white-space:nowrap;transition:all .12s;user-select:none}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{font-size:11px;opacity:.7;font-weight:600}
.chip.disabled{opacity:.4;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.6}
.b-brand{background:var(--brand-soft);color:var(--brand-ink)}.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-err{background:var(--err-soft);color:var(--err)}.b-info{background:var(--info-soft);color:var(--info)}.b-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2)}
.tbl tr:hover td{background:var(--brand-softer)}
.tbl .sticky-col{position:sticky;left:0;background:var(--surface);z-index:1}
.tbl th.sticky-col{z-index:3;background:var(--surface-2)}
.tbl tr:hover td.sticky-col{background:var(--brand-softer)}
.clamp{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.clamp.open{white-space:pre-line;max-width:420px}
.tblwrap{overflow:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
.nav-tab{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.nav-tab:hover{color:var(--text)}.nav-tab.on{background:var(--brand-soft);color:var(--brand-ink)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.flag{display:inline-block;flex:none;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.08);vertical-align:middle}
.hero{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(1200px 400px at 85% -10%,#c9bcff 0%,transparent 60%),radial-gradient(800px 300px at 0% 120%,#ffd9ec 0%,transparent 55%),linear-gradient(135deg,#f4f1ff,#fff 60%);border:1px solid var(--border)}
:root[data-theme="dark"] .hero{background:radial-gradient(1200px 400px at 85% -10%,#3a2a8a 0%,transparent 60%),radial-gradient(800px 300px at 0% 120%,#4a1d3e 0%,transparent 55%),linear-gradient(135deg,#17142e,#121024 60%)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-2);border-radius:18px;padding:8px 8px 8px 18px;box-shadow:var(--shadow-lg)}
.searchbar input{flex:1;background:transparent;border:0;outline:none;font-size:15px;color:var(--text);min-width:0;padding:8px 0}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);z-index:30;max-height:380px;overflow:auto;display:none}
.suggest.show{display:block}
.suggest .it{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;font-size:13px}
.suggest .it:hover,.suggest .it.act{background:var(--brand-softer)}
.pcard{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pcard .media{height:132px;position:relative;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px}
.pcard .media .bigflag{position:absolute;right:-14px;top:-10px;width:120px;height:90px;opacity:.95;transform:rotate(8deg);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);object-fit:cover}
.getby{background:rgba(255,255,255,.95);color:#16142b;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.getby i{color:#5b3df5}
mark{background:#ffe58a;color:#16142b;border-radius:3px;padding:0 2px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-2);border-radius:10px;overflow:hidden}
.stepper button{width:32px;height:32px;font-weight:700;color:var(--brand);background:var(--surface-2)}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.tl{position:relative;padding-left:26px}
.tl:before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border-2)}
.tl .dot{position:absolute;left:-23px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.modal-bg{position:fixed;inset:0;background:rgba(16,14,34,.55);backdrop-filter:blur(4px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-b{padding:20px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 22px 22px}
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--border-2);border-radius:14px;cursor:pointer;transition:all .12s;background:var(--surface)}
.radio-card:hover{border-color:var(--brand)}
.radio-card.on{border-color:var(--brand);background:var(--brand-softer);box-shadow:0 0 0 3px var(--brand-soft)}
.radio-card.locked{cursor:not-allowed;opacity:.65}
.radio-card .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border-2);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.radio-card.on .rd{border-color:var(--brand)}.radio-card.on .rd:after{content:'';width:8px;height:8px;border-radius:50%;background:var(--brand)}
.paper{background:#fff;color:#16142b;border-radius:12px;border:1px solid #e4e2ee;padding:22px;font-size:12px}
.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{padding:7px 6px;border-bottom:1px solid #eee;text-align:left}.paper .r{text-align:right}
.bar{height:9px;border-radius:9px;background:var(--surface-3);overflow:hidden}.bar>div{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.kpi{padding:16px}.kpi .v{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif;font-weight:800;font-size:22px;margin-top:4px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.device{margin:0 auto;transition:width .2s;background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:16px;overflow:hidden}
.device.mobile{width:390px;max-width:100%}.device.tablet{width:780px;max-width:100%}.device.desktop{width:100%}
.device.mobile .lg-grid{grid-template-columns:1fr !important}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;max-width:360px;transition:all .25s}
.acc summary{cursor:pointer;list-style:none}.acc summary::-webkit-details-marker{display:none}
.acc[open] .chev{transform:rotate(180deg)}
.chev{transition:transform .15s}
.hide-scroll{scrollbar-width:none}.hide-scroll::-webkit-scrollbar{display:none}
.sidebar-filters{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:1023px){.sidebar-filters{position:static;max-height:none;display:none}.sidebar-filters.show{display:block}}
.skeleton-pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.5}}
.lock-banner{background:repeating-linear-gradient(45deg,var(--warn-soft),var(--warn-soft) 10px,transparent 10px,transparent 20px);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:600;font-size:12.5px}
@page{size:A4;margin:8mm}
@media print{body>*:not(#print-root){display:none !important}#print-root{display:block !important}#print-root .paper{border:0;border-radius:0;padding:0;max-width:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
#print-root{display:none}
</style>

onths: Residence Permit – Student is lodged at the Austrian Embassy, New Delhi (not VFS); \n   fee payable at Embassy\n\nOther Costs (paid separately):\n* Health insurance (from approved insurer list, €30,000): approx. ₹8,000–15,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Up to 90 days for the residence permit after complete \napplication (plan 3–6 months ahead)","Application Process":"Austria Student Visa Process – Indian Student\n\nFor an Indian student, the process depends mainly on the duration of the course. For a course longer than 6 months, the usual route is Residence Permit – Student (Aufenthaltsbewilligung – Studierender) rather than directly applying for a normal Student Visa.\n\nProcess:\n\n-Get Admission from an Austrian University\n- Receive the Admission/Acceptance Letter.\n- Prepare Documents\n- Apply for Residence Permit – Student\n- Submit the application in person at the Austrian Embassy in New Delhi.\n- The standard decision period is 90 days if all documents are complete.\n- It can be extended by another 90 days if additional documents are required.\n- OeAD recommends applying as early as possible, ideally around 6 months in advance.\n- Receive Approval / Notification\n- If the Austrian authority approves the Residence Permit, the Austrian Embassy informs the applicant.\n- Apply for Visa D\n-After receiving approval, apply for Visa D to enter Austria.\n- The Visa D allows the student to travel to Austria and collect the approved residence permit.\n- Travel to Austria\n- Enter Austria using the Visa D.\n- Carry the important original documents while travelling.\n- Collect Residence Permit\n- After arrival, collect the Residence Permit – Student from the competent residence authority in Austria.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Bank balance in student's name for 12 months:\n Under 24 yrs: €722.58/month (≈ €8,671/year)\n 24 yrs & above: €1,308.39/month (≈ €15,701/year)\n- Extra funds if rent > €386.43/month\n- Account must be accessible from Austria","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission Letter (Zulassungsbescheid) from Austrian university\n- Tuition fee payment confirmation (if applicable)","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory\n- Nostrification / equivalence as required by the university","Medical Examination (if required)":"Not required","Academic and Language Testing Certificate":"- IELTS / TOEFL (English-taught)\n- German B2 / ÖSD / Goethe (German-taught)","HEALTH INSURANCE":"Mandatory — Schengen-valid health insurance, \nmin. €30,000 coverage, from date of arrival until \nresidence-permit / national insurance starts","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"MANDATORY — Police Clearance Certificate \n(apostilled + German translation)","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Birth Certificate (apostilled + German translation)\n- Residence permit application form (signed)\n- Rental contract / accommodation confirmation with rent amount\n- Motivation Letter / Statement of Purpose"},{"_row":4,"country_id":"Belgium","Country":"Belgium","flag":"🇧🇪","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (National Visa D — Study)","Visa Costs":"💰 Fee Bifurcation (as per Embassy of Belgium, New Delhi)\n* Visa D Handling Fee: €250 (from 1 July 2026; paid in INR at Embassy exchange rate)\n* VFS Service Fee: ₹2,750 (incl. taxes)","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Approx. 4–8 weeks — apply 8–12 weeks before \ndeparture (not earlier than 6 months)","Application Process":"Belgium Student Visa Process – Indian Student\n\nFor a regular Bachelor’s, Master’s or PhD programme in Belgium lasting more than 90 days, an Indian student generally applies for a Long-Stay Visa D (Student Visa).\n\nApplication Process – \n\n- Get Admission\n- Obtain the Admission/Registration/Pre-registration Letter.\n- Prepare Documents \n- Complete VisaOnWeb Application\n- Create an account on VisaOnWeb.\n- Complete the online Visa D application form.\n- Submit the form electronically.\n- Print and sign the completed application form.\n- Legalise/Apostille Documents\n- Official documents such as educational certificates, birth certificates, PCC and affidavits may need to be legalised/apostilled.\n- Documents not in English may require translation by a sworn translator into one of Belgium's national languages.\n- Pay Visa Fees\n- Submit Application at VFS\nTake the printed VisaOnWeb application and complete supporting documents to the designated Belgian Visa Application Centre (VFS) in India.\n- The current Indian checklist specifies 1 original + 2 copies of the application file.\nBiometrics\n- Photograph and fingerprints are taken as part of the visa application process.\n- Visa Processing\n- Visa Decision\n- approved, the applicant receives the Visa D.\nTravel to Belgium\nTravel to Belgium within the validity of the Visa D.\nCarry your important original documents and admission documents.\nRegister After Arrival\nAfter arrival, complete the required registration with the relevant Belgian municipal authority and follow the residence formalities for students.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Proof of means: €1,062/month = €12,744 for 12 months (2026–27)\n- Accepted formats: Belgian university blocked account / approved \nblocked-account provider, full scholarship or loan certificate, or Annex 32 \nsponsor undertaking","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission / Enrolment Letter from Belgian institution\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory\n- Equivalence decision only if required (mainly bachelor's / French Community)","Medical Examination (if required)":"MANDATORY — Medical Certificate in the Belgian embassy format (by embassy-approved doctor)","Academic and Language Testing Certificate":"- IELTS / TOEFL (English-taught)\n- French / Dutch certificate (for courses in those languages)","HEALTH INSURANCE":"Mandatory — Schengen-valid health insurance, \nmin. €30,000 coverage, from date of arrival \nuntil residence-permit / national insurance starts","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"MANDATORY — Police Clearance Certificate \n(not older than 6 months, apostilled; applicants 21+)","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Visa D Application Form\n- Motivation Letter / Study plan\n- Birth Certificate (apostilled)\n- Annex 32 sponsor documents (if used)"},{"_row":5,"country_id":"Bulgaria","Country":"Bulgaria","flag":"🇧🇬","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (National Visa D — Study)","Visa Costs":"💰 Fee Bifurcation\n* Visa D Fee: €195 approx. ₹21,700\n* Service / courier charges: ₹2,524 \n\nOther Costs (paid separately):\n* Health insurance: approx. ₹8,000–15,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Bulgaria's student-visa details couldn't be confirmed from official sources — \nplease check with the Embassy of Bulgaria, New Delhi. Approx. 30–35 days \nafter complete application","Application Process":"Bulgaria Student Visa Process – Indian Student\n\nFor an Indian student planning a full-time university course in Bulgaria, the usual route is a Bulgarian Long-Stay Visa Type D, followed by the relevant residence formalities in Bulgaria. Bulgaria's official MFA confirms that Visa D is the long-stay visa category and that a personal interview is mandatory for Type D applications.\n\nApplication Process – \n\n- Get Admission\n- Receive the University Admission/Acceptance Letter.\n- Documents required by the Bulgarian Ministry of Education for the student's admission/residence process.\n- Prepare Visa Documents\n- Passport should generally be valid for at least 18 months for the long-stay application.\n- Provide copies of the relevant passport pages and previous visas/residence permits, where applicable.\n- Foreign-language documents may need to be translated into Bulgarian according to the Bulgarian authorities' requirements.\n- Complete Visa D Application\n- Complete the Bulgarian Long-Stay Visa Type D application.\n- The application must be signed by the applicant.\n- Book Appointment / Submit in India\n- Since 1 November 2025, Bulgarian Visa D applications can also be submitted through VFS Global offices in India.\n- Applications can also be handled through the Bulgarian Embassy/consular process as applicable.\n- Attend Personal Interview\n- Personal appearance/interview is mandatory for Visa D applications.\n- Submit the required application file and complete the applicable biometric/identity procedures at the designated centre.\n- Visa Processing\n- Visa Decision\n- If approved, the applicant receives the Bulgarian Type D Visa.\nTravel to Bulgaria\nTravel to Bulgaria within the validity of the issued visa.\nCarry the original admission, accommodation, financial and other important documents.\nResidence Formalities in Bulgaria\nAfter arrival, complete the required residence registration/residence permit formalities with the competent Bulgarian authorities.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Sponsor’s last 6 months’ bank statement (signed & stamped)\n- Funds for 1 year tuition + living costs (commonly ₹6–8 lakh)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission Letter from Bulgarian university\n- Ministry of Education & Science approval / enrolment order (arranged by university)\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory\n- Recognition of prior education as required by university","Medical Examination (if required)":"Medical fitness certificate (if requested)","Academic and Language Testing Certificate":"- NEET Scorecard (mandatory for Indian MBBS applicants)\n- English proficiency as per university","HEALTH INSURANCE":"Mandatory — Schengen-valid health insurance, \nmin. €30,000 coverage, from date of arrival until \nresidence-permit / national insurance starts","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"Police Clearance Certificate Mandatory\n(apostilled) — commonly requested","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Visa D Application Form\n- Birth Certificate (apostilled)\n- Cover Letter","Additional Supporting Documents (2)":"Legalise & Translate Documents\n\nDocuments may need to be legalised/apostilled as applicable.\nForeign-language documents may need to be translated into Bulgarian according to the Bulgarian authorities' requirements"},{"_row":6,"country_id":"Croatia","Country":"Croatia","flag":"🇭🇷","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (Visa D for entry) + Temporary Residence Permit","Visa Costs":"💰 Fee Bifurcation\n* Temporary stay approval (study): €46.45\n* Biometric residence permit card: €31.85 (€59.73 accelerated)\n* Visa fee (if entering on visa): €90 + ₹2,553 VFS service fee\n\nOther Costs (paid separately):\n* Health insurance: approx. ₹8,000–15,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Temporary stay approval can take up to ~3 months (fast-track option \navailable at extra cost)","Application Process":"Croatia Student Visa Process – Indian Student\n\nFor an Indian student pursuing a full-time higher-education course in Croatia, the process generally involves obtaining temporary residence for the purpose of study. Since Indian nationals require a visa to enter Croatia, a Long-Stay Visa D may be required after temporary residence is approved.\n\nApplication Process – \n\n- Get University Admission\n- Prepare Required Documents\n- Apply for Temporary Residence – Study\n- Submit the application for temporary residence for study purposes.\n- Indian students can submit through the competent Croatian diplomatic mission/consular office.\n- Biometrics / Personal Submission\n- Applications are submitted personally where required.\n- Fingerprints and other biometric information are collected for the residence permit.\n- Temporary Residence Approval\n- Once approved, the student receives approval for temporary residence.\n- A biometric residence permit is subsequently issued.\n- Apply for Long-Stay Visa D\n- If the student requires a visa to enter Croatia, apply for the Croatian Long-Stay Visa D after temporary residence has been approved.\n- The D Visa is primarily an entry visa allowing the holder to enter Croatia and complete the residence formalities.\n- Submit D Visa Application\n- Complete and sign the D Visa application.\n-Submit the passport, photograph, proof of approved temporary residence, insurance and other required documents.\n- The application is submitted in person at the competent Croatian Embassy/Consulate or designated VFS centre.\n- Travel to Croatia\n- After receiving the D Visa, travel to Croatia within its validity.\n- Carry the original admission, accommodation, financial and residence documents.\n- Register Address After Arrival\n- After entering Croatia, the student must complete the required residence/address registration with the competent police administration/station.\n- Croatian authorities specify additional registration deadlines depending on how the temporary residence was obtained.\n- Collect/Complete Residence Permit Formalities\n- Complete biometric residence permit formalities.\n\nFollow the applicable health-insurance registration requirements after residence approval.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"Croatia's minimum funds amount couldn't be confirmed from official sources — \nconfirm the current MUP figure with the Embassy of Croatia, New Delhi. - Sponsor’s \nlast 6 months’ bank statement (signed & stamped)\n- Proof of means of support for the stay (amount set by Croatian Ministry of Interior — \nconfirm current figure with embassy)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission / Enrolment Confirmation from Croatian institution\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory\n- Recognition of foreign qualification as required by university","Medical Examination (if required)":"Not required usually","Academic and Language Testing Certificate":"As per university — IELTS / TOEFL","HEALTH INSURANCE":"Mandatory — Schengen-valid health insurance, \nmin. €30,000 coverage, from date of arrival until \nresidence-permit / national insurance starts","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"Police Clearance Certificate \n(apostilled + Croatian translation) —Mandatory","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Form 1a (temporary stay application)\n- Birth Certificate (apostilled + translated)\n- Proof of secured housing\n- Legalise & Translate Documents\n- Foreign documents may need to be legalised/apostilled as applicable."},{"_row":7,"country_id":"Czechia","Country":"Czechia/ Czeck Republic","flag":"🇨🇿","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (Long-term Visa for Study) / Long-term Residence Permit for Study","Visa Costs":"💰 Fee Bifurcation (as per Czech Ministry of Foreign Affairs)\n* Long-term Visa for Study: CZK 2,500 — non-refundable\n* Applied directly at the Embassy of the Czech Republic, New Delhi (by appointment) — no VFS service fee for long-stay\n\nOther Costs (paid separately):\n* Comprehensive medical insurance (after approval): approx. ₹15,000–30,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Up to 60 days (decided by Czech Ministry of the Interior; cannot be expedited)","Application Process":"Czechia Student Visa Process – Indian Student\n\nFor an Indian student planning to study in Czechia for more than 3 months, the route is generally a Long-Term Residence Permit for the Purpose of Study for longer-term university studies. Depending on the programme, a Long-Term Visa for Study may apply instead.\n\nApplication Process – \n\n- Get University Admission\n- Determine the Correct Visa/Residence Category\n- University studies, particularly programmes lasting longer than one year, generally fall under the Long-Term - - - Residence Permit – Purpose of Study.\nPrepare Required Documents\n- Book Appointment\n- Indian applicants must arrange an appointment according to the Czech Embassy in New Delhi's current study-application procedure.\n- The Embassy currently has a specific appointment process for Indian applicants applying for study/educational activities.\n- Submit Application in Person\n- Applications are submitted personally at the Embassy of the Czech Republic in New Delhi.\n- Biometrics & Interview\n- Fingerprints are collected.\n- An interview is held as part of the application process.\n- Application Processing\n- After approval, the applicant must provide the required medical travel insurance before the visa is issued.\n- Receive Long-Term Visa / Entry Visa\n- If a long-term residence permit was approved, the Czech Embassy issues a long-term visa for the purpose of collecting the residence permit.\nThis entry visa is generally issued for a limited period to allow the student to enter Czechia and collect the residence card.\nTravel to Czechia\nTravel after receiving the required visa.\nCarry the original admission, accommodation, financial and other important documents.\nCollect Residence Permit\nAfter arrival, visit the relevant Czech Ministry of the Interior office.\nSubmit biometric data where required and collect the biometric residence card.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Bank statement (last 3 months) in student's name + copy of linked debit card\n- Minimum funds = 15× monthly subsistence minimum + 2× subsistence minimum \nfor each further month (≈ CZK 1.15 lakh for 12 months as per current calculation — verify)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Confirmation of Studies / Enrolment (in Czech) from accredited Czech university\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory\n- Nostrification of previous studies as required by university","Medical Examination (if required)":"Not required usually","Academic and Language Testing Certificate":"As per university — IELTS / TOEFL","HEALTH INSURANCE":"Comprehensive medical insurance (Czech-law compliant) — \narranged after visa approval as instructed by embassy","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"MANDATORY — Police Clearance Certificate \n(India + any country lived 6+ months in last 3 years; apostilled + Czech translation)","Accommodation Documents":"MANDATORY — Confirmation of accommodation / lease agreement (original)","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Long-term visa application form (signed)\n- Birth Certificate (apostilled)\n- Cover Letter"},{"_row":8,"country_id":"Denmark","Country":"Denmark","flag":"🇩🇰","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"E-Visa (ST1 Residence & Work Permit — SIRI, online)","Visa Costs":"💰 Fee Bifurcation\n* SIRI Case-processing Fee: DKK 3,060 (≈ ₹40,000) — pay online before applying (verify on nyidanmark.dk)\n* Ministry of Foreign Affairs consular fee (dys.um.dk webshop): as applicable\n* VFS Service Fee (biometrics): ₹2090\n\nOther Costs (paid separately):\n* Private insurance until CPR registration: approx. ₹5,000–10,000","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Normal processing: approx. 2 months (up to 3 months if more documents needed)","Application Process":"Denmark Student Visa Process – Indian Student\n\nFor an Indian student planning to study in Denmark, the main immigration route is a Residence and Work Permit for Students, rather than a traditional “student visa.” The application is processed by the Danish Agency for International Recruitment and Integration (SIRI).\n\nApplication Process – \n\n- Get University Admission\n- For higher education, the institution must complete its part of the student residence application.\n- Create a Case Order ID on the SIRI/New to Denmark portal.\n- This is required before submitting the residence-permit application.\n- Pay SIRI Application Fee\n- Pay the applicable residence-permit processing fee.\n- Keep the payment receipt as proof of payment.\n- Prepare Required Documents\n- Biometrics\n- Provide facial photograph and fingerprints as part of the residence-permit application.\n- Application Processing\n- Residence Permit Decision\n- If approved, the student receives the Danish residence permit for study.\n- The permit also provides the applicable work rights associated with the student category.\n- Travel to Denmark\n- After receiving the required residence/entry permission, travel to Denmark.\n- Carry the original admission and important immigration documents.\n- Register After Arrival\n- Complete the required Danish registration formalities after arrival, including obtaining the relevant CPR number and other local registrations.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"SIRI links the funds amount to the SU rate, and I couldn't confirm the exact 2026 figure — \nplease check nyidanmark.dk. - Proof of self-support may be requested by SIRI \n(amount tracks the Danish SU rate — verify current monthly figure on nyidanmark.dk)\n- Funds must be in the student's own account","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission Letter from Danish institution\n- ST1 form (institution part completed & signed)\n- Tuition fee payment receipt (first semester)","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"Not required","Academic and Language Testing Certificate":"As per university — IELTS / TOEFL","HEALTH INSURANCE":"Private insurance recommended until registration in the \nDanish public health system","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"Not required","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- SIRI fee payment receipt\n- Copy of ALL passport pages incl. blank pages & covers\n- Parental consent (if under 18)"},{"_row":9,"country_id":"Estonia","Country":"Estonia","flag":"🇪🇪","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (D Visa for study) → Temporary Residence Permit for Study","Visa Costs":"💰 Fee Bifurcation\n* D Visa Fee: approx. €100 (verify with Estonian mission)\n* Service / VFS fee: as applicable\n* Temporary Residence Permit state fee in Estonia (studies > 1 year)\n\nOther Costs (paid separately):\n* Health insurance: approx. ₹8,000–15,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- D visa: up to 30 calendar days\n- Residence permit: up to ~2 months","Application Process":"Estonia Student Visa Process – Indian Student\n\nFor an Indian student studying in Estonia, the immigration route depends on the duration of the programme. For studies requiring a stay of up to 1 year, a Long-Stay Visa (D Visa) can be used. For longer studies, students generally need a temporary residence permit for study. Estonia's D visa can be issued for up to 365 days within 12 months.\n\nApplication Process –\n\n- Get University Admission\n- Determine the Correct Immigration Route (Up to 1 year: Long-Stay D Visa may be applicable.\nLonger than 1 year: Apply for a Temporary Residence Permit for Study as applicable.)\n- Prepare Required Documents\n- Complete D Visa Application\n- Book Appointment\n- Submit Application in Person\n- Biometrics\n- Pay Visa Fee\n- Visa Decision\n- Travel to Estonia\n- Residence Permit – For Longer Studies (If the course requires a stay beyond the D Visa period, complete the applicable Temporary Residence Permit for Study process.\nFollow the instructions of the Estonian Police and Border Guard Board.)\n\nImportant: For Indian students, the exact route should be determined from the course duration and programme type before filing. The Estonian Ministry of Foreign Affairs specifically lists documents proving that the applicant is going to study in Estonia as part of the D Visa application.","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Sponsor’s / student's last 6 months’ bank statement (signed & stamped)\n- Sufficient legal income: €880 per month (2026 PPA requirement)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission Letter from Estonian university\n- University invitation (sent to Police and Border Guard Board)\n- Tuition fee payment confirmation","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory\n- HAKA / ENIC-NARIC equivalency if requested by university","Medical Examination (if required)":"Not required","Academic and Language Testing Certificate":"As per university — IELTS / TOEFL","HEALTH INSURANCE":"Mandatory — Schengen-valid health insurance, \nmin. €30,000 coverage, from date of arrival until \nresidence-permit / national insurance starts","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"Criminal record certificate from every country lived in 3+ consecutive \nmonths during last 3 years (for residence permit)","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- D visa application form + additional forms\n- Motivation Letter\n- Birth Certificate (apostilled)"},{"_row":10,"country_id":"Finland","Country":"Finland","flag":"🇫🇮","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"E-Visa (Residence Permit for Studies — Enter Finland, online)","Visa Costs":"💰 Fee Bifurcation\n* Residence Permit for Studies (online, Migri): \n* Online application: €600 \n* Paper application: €750\n* VFS Service Fee: €20 (≈ ₹2,232 incl. GST)\n* Optional D Visa: €95 online / €120 paper\n\nOther Costs (paid separately):\n* Health insurance meeting Migri conditions: approx. ₹10,000–25,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Approx. 1–3 months (apply ~3 months before studies start)","Application Process":"\"Finland Student Residence Permit Process:\n\n- Admission: Obtain admission/acceptance letter from a Finnish university.\n- Online Application: Apply through Enter Finland → Residence Permit for Studies.\n- Documents: Upload passport, admission letter, academic documents, financial proof, tuition-fee proof/scholarship, and health insurance.\n- Financial Proof: Show minimum €800/month (€9,600/year) for living expenses, plus tuition fees if applicable.\n- Application Fee: Pay €600 for the online residence permit application.\n- VFS Appointment: Book a Residence Permit appointment through VFS Finland in India.\n- Biometrics: Attend the appointment for identity verification, fingerprints, and original document verification.\n- Decision: Application is processed by the Finnish Immigration Service (Migri).\n- Residence Permit Card: Receive/collect the residence permit card.\n- Travel: Travel to Finland and commence studies.\n\nD Visa: Optional. It can be applied for together with the residence permit to facilitate earlier travel to Finland after approval.\"","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Student's bank statement showing funds at application:\n €800 per month → €9,600 for 1 year (studies of 1 year or longer)\n- Plus unpaid tuition fee (if not yet paid)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Acceptance Letter from Finnish university\n- Tuition fee payment proof / scholarship decision","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"Not required","Academic and Language Testing Certificate":"As per university — IELTS / TOEFL / PTE","HEALTH INSURANCE":"Please verify Migri's current insurance-cover thresholds. \nMandatory — health insurance meeting Migri conditions \n(coverage level depends on study length; min. €120,000 for studies under 2 years)","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"Not required","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Guardian consent (if under 18)\n- Statement of Purpose (if requested)"},{"_row":11,"country_id":"France","Country":"France","flag":"🇫🇷","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (VLS-TS Long-Stay Student Visa)","Visa Costs":"💰 Fee Bifurcation\n* Études en France (Campus France) Fee: ₹20,000 (from 1 Aug 2026; earlier ₹18,500)\n* Visa Fee (VLS-TS): €90 (Standard rate) €50 (≈ ₹5,450) — reduced rate for EEF countries incl. India\n* VFS Service Fee: approx. ₹2,420\n\nOther Costs (paid separately):\n* After arrival: VLS-TS validation (OFII) €150 approx.\n* CVEC contribution: €105\n* Health insurance (until French social security): approx. ₹5,000–15,000","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- Campus France procedure: approx. 4–8 weeks\n- Visa after VFS submission: approx. 2–4 weeks","Application Process":"France Student Visa Process – Indian Student\n\nFor an Indian student, the process for a course longer than 3 months generally involves the Etudes en France (EEF) / Campus France procedure, followed by a long-stay student visa application through France-Visas and VFS. India is one of the countries covered by the EEF procedure\n\nApplication Process –\n\n- Get Admission\n- Create Etudes en France (EEF) Account\n- Submit EEF Application\n- Pay Campus France Fee\n- Attend Campus France Interview\n- Complete France-Visas Application\n- Prepare Visa Documents\n- Book VFS Appointment\n- Submit Visa Application at VFS\n- Biometrics\n- Visa Processing\n- Visa Decesion\n- Collect Passport\n- Travel to France","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Sponsor’s / student's last 3–6 months’ bank statement (signed & stamped)\n- Applications from 1 Aug 2026: 1 year tuition + approx. €877.50 per month \n(47% of SMIC) for 12 months ≈ €10,530\n- Applications before 1 Aug 2026: €615 per month (€7,380 / year)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Itinerary (book confirmed ticket after visa approval)\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\n\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current Account Statement\n\n* Sponsorship Letter signed by Sponsor (Notarised preferred)\n* Sponsor's Passport Copy (if available)\n* Sponsor's PAN Card Copy","University offer letter/ Confirmation Documents":"- Admission / Pre-registration Letter from French institution\n- Campus France (EEF) validation / NOC\n- Tuition fee payment confirmation (if applicable)","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"MANDATORY — Campus France (Études en France) registration, document check & interview","Medical Examination (if required)":"Not required","Academic and Language Testing Certificate":"- IELTS / TOEFL (English-taught)\n- DELF / DALF / TCF / TEF (French-taught)","HEALTH INSURANCE":"Mandatory — Schengen-valid health insurance, \nmin. €30,000 coverage, from date of arrival \nuntil residence-permit / national insurance starts","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (ICAO / Schengen standard)\n- Size: 35mm × 45mm\n- Background: White\n- Face Coverage: 70–80%\n- Recent: Taken within the last 6 months","(PCC)":"Not required","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- France-Visas application form (printed & signed)\n- Motivation Letter / Statement of Purpose\n- CV / Resume\n- Birth Certificate"},{"_row":12,"country_id":"Germany","Country":"Germany","flag":"🇩🇪","region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (National D Visa)","Visa Costs":"💰 Fee Bifurcation (as per VFS Germany India, effective 10 July 2025)\n* National Visa Fee (Adult): €76 /  ₹8,400\n* VFS Service Fee: ₹1,126\n* D-Visa Logistic Fee: ₹1,561\n* Optional: Courier ₹755 | Courier Assurance ₹1,033 | SMS ₹161 | Premium Lounge ₹3,396\n\nOther Costs (paid separately):\n* Health insurance: approx. €35–€140/month","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"* Approximately 6–12 weeks after submission of a complete application.\n* Processing time may vary depending on the Consulate/Embassy and the individual case.","Application Process":"Germany Student Visa Application Process – India\n\n- Get University Admission\n- Obtain Admission Letter / Letter of Acceptance from the German university.\n- Confirm course, intake, tuition/semester fees and enrolment requirements.\n- Apply for APS Certificate\n- Indian students generally need an APS Certificate for Bachelor/Master studies at German universities.\n- Arrange Financial Proof\n- Demonstrate sufficient funds for your stay.\n- Commonly this is through a blocked account, scholarship or another accepted form of financial proof.\nIf tuition is applicable, the German Missions may require proof that the required tuition has been paid; for private universities, the first year may need to be paid or a substantial deposit made.\n- Arrange Health Insurance\nPrepare Visa Documents (Passport, APS Certificate,if applicable, University Admission Letter, Academic Certificate & Transcripts,\nProof of financial resources, Health Insurance, Accomodation details,)\n- Apply Through the Consular Services Portal\n- Select National Visa → Studies.\n- Complete the questionnaire and upload the required documents.\n- Select the German mission responsible for your place of residence in India, not simply your preferred city.\n- Book/Attend Appointment\n- Depending on the applicant category and mission, the application is generally submitted through VFS Global or, for certain categories, directly at the German mission.\n- Students with APS certificates are generally handled through VFS.\n- Biometrics & Interview\n- Submit original documents, fingerprints and photograph as required.\nThe visa officer may ask questions regarding your course, university, finances, academic background and study plans.\nIf approved, the passport is returned with the German National Visa.\nThe current adult national-visa fee is ₹8,400 (€75), plus the applicable VFS service fee.\nAfter Arrival in Germany\nRegister your address with the local residents' registration office.\nApply for the appropriate residence permit with the local Foreigners Authority if required. The entry visa is normally limited in validity and does not cover the entire study period.","Passport":"- Valid Passport\n(issued within the last 10 years, valid with at least 2 blank pages)\n- Front & Back Pages\n- Minimum 6 Months Validity","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required","Bank Statement with Minimum Balance":"- 1st Year Tuition Fee: Paid before visa application, with proof of payment.\n- Blocked Account: €11,904 for 1 year, with a maximum withdrawal of €992/month.","Other Financial Documents":"- Private University Tuition: Proof of the first-year tuition fee amount and payment\n- Education Loan: Loan approval/sanction proof (If applicable)\n- Scholarship Letter\n- Health Insurance: Proof of compulsory health insurance from the intended date of arrival.\n- Parents' Indian bank statement / sponsorship affidavit ( Only to support the profile)","Flight Tickets and Accomodation Voucher":"- Confirmed Flight Tickets\n- Confirmed Temporary Accomodation Voucher","Employment Documents/ Business Documents":"If Sponsored by another person or by themselves\n- Employment Certificate of that person\n- 6 Months’ Salary Slips of that person\nIf Sponsor is a Business Owner\n- GST Certificate\n- Current A pprox. 3–5 weeks (Visa D); residence permit up to ~21–70 days","Application Process":"Hungary Student Visa Process – Indian Student\n\nFor an Indian student, the main immigration route for full-time higher education in Hungary is the Residence Permit for the Purpose of Studies. A separate visa application is generally not required; when applying from India, the residence-permit application also includes the application for the entry visa needed to collect the residence permit.\n\nApplication Process – \n\n- Get University Admission\n- Check Language Requirement\n- Pay Tuition Fee\n- Prepare Required Documents\n- Submit Residence Permit Application\n- No Separate Visa D Application at the Start (The residence-permit application itself includes the application for the visa that allows the approved student to enter Hungary and collect the residence permit.)\n- Biometrics & Personal Appearance\n- Application Processing\n- Residence Permit Approval\n- Travel to Hungary\n- Collect Residence Permit","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance":"- Sponsor’s / student's last 6 months’ bank statement (signed & stamped)\n- Funds for living costs + tuition (or Stipendium Hungaricum award letter)","Other Financial Documents":"- ITR: Last 3 years.\n- Education Loan: Loan sanction letter, if applicable.\n- Fixed Deposit: FD proof, if applicable.\n- Scholarship/Sponsorship Letter: If applicable.\n- Bank Letter/Certificate: Proof of account ownership/funds, if required.\n- Proof of Source of Funds / Income","Flight Tickets and Accomodation Voucher":"- Flight Reservation / Iti region":"Schengen — Europe","Visa Type":"Student Visa","TAGS":"Sticker Visa (National Visa D — via Swiss representation)","Visa Costs":"💰 Fee Bifurcation\n* National Visa D fee: as per Swiss Embassy / VFS Switzerland (verify)\n* Residence permit fee in Liechtenstein after approval\n\nOther Costs (paid separately):\n* Health insurance (€30,000 Schengen-valid): approx. ₹8,000–15,000/year","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"Approx. 8–12 weeks (requires approval from Liechtenstein Migration & Passport Office)","Application Process":"Liechtenstein Student Visa Process – Indian Student\n\nFor an Indian student (non-EU/EEA/Swiss national), studying in Liechtenstein generally requires a Liechtenstein residence permit plus an entry visa. Liechtenstein's student route uses a short-term residence permit (L permit), which can be valid for up to 12 months and can be renewed if the studies continue.\n\nApplication Process – \n\n- University Admission\n- Check Residence & Visa Requirement\n- Apply for Residence Permit\n- L Permit for Study (Maximum validity 12 Months)\n- Prepare Documents\n- Submit Residence Application (Submit the complete application to the Migration and Passport Office.\nFor an L permit, the official deadline is at least 14 days before the planned start of training,)\n- Residence Authorization\n- Apply for Entry Visa\n- National Visa – Type D\n- Biometrics / Visa Formalities\n- Visa Processing (8 to 12 Weeks)\n- Visa Approval\n- Travel to Liechtenstein\n- Residence Permit / Card","Passport":"- Valid Passport (issued within the last 10 years)\n- Front & Back Pages\n- Valid at least 3 months beyond intended stay, min. 2 blank pages","Academic Transcripts":"Undergraduate\n10th Marksheet\n12th Marksheet\n\nPost-Graduate\nGraduation Marksheets and Certificate\nPost Graduation Marksheets and Certificate ( If applicable )\n\nAcademic Transcripts Required\n\nNote: Copies with Apostille (MEA) required","Bank Statement with Minimum Balance" ition fee payment receipt (deposit / first year)","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not mandatory for visa\n- WES / ICAS evaluation only if required by institution","Medical Examination (if required)":"Upfront Medical Examination by an IRCC panel physician (required for Indian applicants)","Academic and Language Testing Certificate":"- IELTS / PTE / TOEFL / CELPIP / Duolingo (as per DLI)\n- French test (TEF / TCF) for French-taught programmes","HEALTH INSURANCE":"Not required for visa (provincial / university health plan after arrival)","Travel History":"Travel History – Last 10 Years\nAll previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs (IRCC spec)\n- Size: 35mm × 45mm\n- Background: Plain white / light\n- Recent: Taken within the last 6 months","(PCC)":"Not required usually — police certificate only if IRCC requests","Accommodation Documents":"Not mandatory\n- University housing / accommodation proof (supporting)","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Statement of Purpose / Study Plan\n- Family Information Form (IMM 5707)\n- Custodian Declaration (if under 18)\n- Proof of ties to India\n- Resume / CV & work experience letters (if applicable)"},{"_row":35,"country_id":"russia","Country":"Russia","flag":"🇷🇺","region":"Europe & CIS","Visa Type":"Student Visa","TAGS":"Sticker Visa (Study Visa — single entry, extended in Russia)","Visa Costs":"💰 Fee Bifurcation\n* Consular Visa Fee (single entry): approx. ₹10,430 (standard) / ₹18,110 (urgent)\n* Consular Visa Fee (double entry): approx. ₹15,038 (standard) / ₹27,326 (urgent)\n* Russian Visa Centre walk in Fee: approx. ₹2,500\n* Study invitation (visa support): usually arranged by university (some charge a fee)\n\nOther Costs (paid separately):\n* Notary Charges - ₹300","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- Invitation (visa support) from university/MVD: approx. 3–6 weeks\n- Visa aft t receipt (if paid)","Academic/Profile Evaluation Document (WES, CampusFrance, APS)":"Not required","Medical Examination (if required)":"- HIV Test Certificate (blood test, within 3 months, in English & Russian) — mandatory for stay over 3 months\n- General Medical Fitness Certificate","Academic and Language Testing Certificate":"- As per university (Russian-taught: preparatory faculty)\n- NEET Scorecard (mandatory for Indian MBBS applicants)","HEALTH INSURANCE":"Mandatory — medical insurance valid in Russia for the stay (university often \narranges; checked at registration)","Travel History":"Last 12 months travel history and all previous visas copy (if any)","Passport SIze Coloured Photo":"Passport-Size Colour Photographs\n- Size: 35mm × 45mm (3.5 × 4.5 cm)\n- Background: White / light\n- Recent: Taken within the last 6 months\n(Carry 10–12 extra for university & registration)","(PCC)":"Not mandatory (may be requested by university)","Accommodation Documents":"* University Hostel Confirmation\nOR\n* Rental Agreement\nOR\n* Residence / Accommodation Confirmation Letter","Residence Proof":"* Aadhaar Card","Additional Supporting Documents":"- Visa Application Form (online, printed & signed)\n- Parental Consent Letter, if under 18\n- Birth Certificate\n- Student Aadhaar Card"},{"_row":36,"country_id":"georgia","Country":"Georgia","flag":"🇬🇪","region":"Europe & CIS","Visa Type":"Student Visa","TAGS":"Sticker Visa (D3 Long-term Study Visa)","Visa Costs":"💰 Fee Bifurcation\n\n* D3 Student Visa – Regular: $20 / ₹1790\n* D3 Student Visa – Priority: $100 / ₹8950\n* D3 Student Visa – Urgent Priority: $200 / ₹17900\n* VFS Service Fee: ₹1,500 per application (incl. GST & Convenience Fee)\n\nAdditional Charges (if applicable):\n\nMandatory Courier – Satellite Locations: ₹846\n\nOther Costs (paid separately):\n* Travel / health insurance: approx. ₹3,000–8,000","B2B Service Fee":"5000 INR","B2C Service Fee":"20000 INR","TAT":"- Minimum approx. 2 months (per VFS) — apply early\n-
